<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f7f4ee">
<title>지안·선규 4주 홈 프로그램</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
  :root{
    --bg:#f7f4ee; --card:#fff; --ink:#1f2328; --muted:#6b7078; --line:#e6e1d8;
    --jian:#e2725b; --jian-soft:#fbe9e4; --sg:#3a7ca5; --sg-soft:#e3eff6;
    --ok:#2f9e6b; --mid:#d99a1e; --help:#c4473a; --radius:16px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;
    font-size:16px;line-height:1.55}
  .wrap{max-width:560px;margin:0 auto;padding:16px 16px calc(96px + env(safe-area-inset-bottom))}
  header.top{display:flex;align-items:center;gap:8px;margin:4px 0 16px}
  header.top h1{font-size:19px;margin:0;flex:1;letter-spacing:-.3px}
  .back{border:0;background:none;font-size:15px;color:var(--muted);padding:8px 4px;cursor:pointer}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px}
  .muted{color:var(--muted);font-size:14px}
  .small{font-size:13px}
  h2{font-size:17px;margin:0 0 8px}
  h3{font-size:15px;margin:16px 0 6px}
  .btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:600;cursor:pointer;
       background:var(--ink);color:#fff;text-align:center}
  .btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
  .btn.jian{background:var(--jian)} .btn.sg{background:var(--sg)}
  .btn:disabled{opacity:.4}
  .row{display:flex;gap:8px} .row>*{flex:1}
  .kid{position:relative;cursor:pointer;border-width:2px}
  .kid.jian{border-color:var(--jian-soft)} .kid.sg{border-color:var(--sg-soft)}
  .kid .name{font-size:22px;font-weight:700}
  .kid.jian .name{color:var(--jian)} .kid.sg .name{color:var(--sg)}
  .badge{display:inline-block;font-size:12px;font-weight:600;border-radius:99px;padding:2px 10px;background:#f0ece4;color:var(--muted)}
  .badge.today{background:var(--ink);color:#fff}
  .bar{height:8px;border-radius:99px;background:#f0ece4;overflow:hidden;margin:10px 0 4px}
  .bar>i{display:block;height:100%;border-radius:99px}
  .weeks{display:flex;gap:6px;margin-bottom:12px}
  .weeks button{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 0;font-size:14px;font-weight:600;cursor:pointer}
  .weeks button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .sess{display:flex;align-items:center;gap:12px;cursor:pointer}
  .sess .num{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:#f0ece4;flex:none}
  .sess.done .num{background:var(--ok);color:#fff}
  .sess .t{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:8px 14px;font-size:15px;cursor:pointer}
  .chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .res3{display:flex;gap:6px;margin-top:10px}
  .res3 button{flex:1;border:2px solid var(--line);background:#fff;border-radius:12px;padding:12px 4px;font-size:15px;font-weight:600;cursor:pointer}
  .res3 button.on.ok{background:var(--ok);border-color:var(--ok);color:#fff}
  .res3 button.on.mid{background:var(--mid);border-color:var(--mid);color:#fff}
  .res3 button.on.help{background:var(--help);border-color:var(--help);color:#fff}
  .res3 button.on.neutral{background:var(--ink);border-color:var(--ink);color:#fff}
  .steps{display:flex;gap:4px;margin-bottom:14px}
  .steps i{flex:1;height:5px;border-radius:99px;background:#e6e1d8}
  .steps i.on{background:var(--ink)}
  .stepname{font-size:13px;font-weight:700;letter-spacing:.3px;color:var(--muted)}
  .big{font-size:20px;font-weight:700;line-height:1.45;margin:6px 0 10px;letter-spacing:-.3px}
  .timer{font-variant-numeric:tabular-nums;font-size:44px;font-weight:700;text-align:center;margin:6px 0}
  .timer.over{color:var(--help)}
  .note{background:#faf8f3;border-radius:12px;padding:12px;font-size:14px;color:#4a4f57;margin-top:10px}
  textarea,input[type=text],input[type=date]{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:16px;font-family:inherit;background:#fff}
  textarea{min-height:76px;resize:vertical}
  label.f{display:block;font-weight:600;font-size:14px;margin:14px 0 6px}
  .photo{width:100%;border-radius:12px;margin-top:8px}
  .bottom{position:fixed;left:0;right:0;bottom:0;background:rgba(247,244,238,.96);backdrop-filter:blur(8px);
          border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
  .bottom .in{max-width:560px;margin:0 auto}
  .tabs{display:flex;gap:6px}
  .tabs button{flex:1;border:0;background:none;padding:6px;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer;border-radius:10px}
  .tabs button.on{color:var(--ink);background:#ece7dd}
  ul.clean{margin:6px 0 0;padding-left:20px} ul.clean li{margin:3px 0}
  .hw{display:flex;align-items:center;gap:12px}
  .hw .check{width:44px;height:44px;border-radius:12px;border:2px solid var(--line);display:grid;place-items:center;font-size:22px;cursor:pointer;background:#fff;flex:none}
  .hw .check.on{background:var(--sg);border-color:var(--sg);color:#fff}
  .week7{display:flex;gap:4px;margin-top:8px}
  .week7 span{flex:1;text-align:center;font-size:12px;padding:4px 0;border-radius:8px;background:#f0ece4;color:var(--muted)}
  .week7 span.on{background:var(--sg);color:#fff}
  .rec{border-left:4px solid var(--line);padding-left:10px;margin:10px 0}
  .rec.jian{border-color:var(--jian)} .rec.sg{border-color:var(--sg)}
  .toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;font-size:14px;z-index:9;opacity:0;transition:opacity .2s;pointer-events:none}
  .toast.show{opacity:1}
  pre.report{white-space:pre-wrap;font-family:inherit;font-size:14px;background:#faf8f3;border-radius:12px;padding:12px;margin:8px 0}
  .linkbtn{background:none;border:0;color:var(--sg);font-size:14px;cursor:pointer;padding:0;text-decoration:underline}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="bottom" id="bottom"></div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   프로그램 내용 (문서 "지안·선규 4주 홈 프로그램" 기준)
   내용을 바꾸고 싶으면 이 PROGRAM 부분만 고치면 됩니다.
   ============================================================ */
const QUESTION_CARDS = [
  "투명인간이 되면 뭐 할래? 그게 괜찮은 일일까?",
  "로봇이 숙제를 대신 해주면 좋을까?",
  "동물원은 동물한테 좋은 곳일까?",
  "친구가 거짓말을 하면 말해줘야 할까?",
  "돈이 아주 많으면 행복할까?"
];

const PRINCIPLES = [
  '정답을 말해주지 말고 "왜?", "어떻게 알았어?"로 되묻는다.',
  "지안이의 자유 그림 시간은 프로그램과 별개로 그대로 둔다.",
  "선규 활동은 성공으로 끝낸다. 어려우면 한 단계 낮춰서 마무리한다.",
  "두 아이를 비교하지 않는다. 같은 날 하지 않도록 요일을 나눈 이유다.",
  "매 회차 사진 1장과 기록 1줄은 반드시 남긴다."

const PROGRAM = {
  jian: {
    name: "지안", cls: "jian", color: "var(--jian)",
    days: [1, 3, 6], dayLabel: "월·수·토", length: "50~60분",

    steps: [
      { key: "talk",  title: "대화·토론", min: 10 },

      { key: "ai",    title: "AI 대화",   min: 10 }
    ],
    weeks: [
      { title: "뇌는 연습하면 자란다", sub: "신경가소성",
        words: ["신경가소성", "연습", "습관"],
        sessions: [
          { main: "안 쓰는 손으로 이름 쓰기 첫 기록", q: "어른이 되면 뇌는 더 이상 안 바뀔까?" },
          { main: "매일 연습한 손글씨 비교. '뇌에 길이 생기는 과정'을 그림으로 그리기" },
          { main: "그림책 1장면 \"연습을 시작한 주인공\" 그리기 + 한 단락 쓰기", book: 1 }
        ],
        ai: "\"뇌는 어떻게 새로운 걸 배워?\"를 Claude에게 묻고, 답에서 모르는 단어 1개 찾아오기",
        supplies: "연구노트, 연필, 타이머, 피아노 한 소절 악보" },
      { title: "돈은 어디로 갈까", sub: "금융교육",
        words: ["예산", "가격", "이익", "저축"],
        sessions: [
          { main: "저금통 3개(쓰기/모으기/나누기) 꾸미기", q: "비싸게 팔면 무조건 좋은 걸까?" },
          { main: "지안이 그림 가게 열기. 재료비 계산, 가격표·광고 문구 직접 쓰기, 가족에게 판매하고 장부 기록",

        sessions: [
          { main: "틀린 문장 찾기(맞춤법 함정). 찾은 뒤 \"어떻게 알았는지\" 쓰기" },
          { main: "같은 과자를 예쁜 접시와 봉지에 담아 가족 맛 평가 받기. 결과 분석하고 \"왜 점수가 달랐을까?\" 그림으로 설명", predict: true },
          { main: "그림책 4장면 완성 + 표지 그리기. 가족 앞에서 5분 발표 (원고 직접 쓰기)", book: 4 }
        ],
        ai: "엄마가 일부러 Claude에게 틀린 사실을 섞은 질문을 하고, 지안이가 Claude 답에서 이상한 점 찾기",
        supplies: "같은 과자 2봉, 예쁜 접시, 평가표, 그림책 제본용 스테이플러·색지" }
    ]
  },
  sg: {
    name: "선규", cls: "sg", color: "var(--sg)",
    days: [2, 4, 0], dayLabel: "화·목·일", length: "20~30분",
    goal: "치료실에서 배운 것을 집과 생활에서 해내기",
    steps: [
      { key: "lang", title: "언어", min: 8,  area: "언어" },
      { key: "work", title: "작업", min: 10, area: "작업" },
      { key: "cog",  title: "인지 게임", min: 10, area: "인지" }
    ],
    weeks: [
      { title: "종성 ㄹ 단어 + 사선 만들기",
        lang: "양말·거울·물·꿀·달 생활 단어. 양말 신을 때 \"양말\", 세수할 때 \"거울\", 물 마실 때 \"물 주세요\"",
        work: "젓가락 두 개로 X 만들기, 바닥에 마스킹테이프로 사선 붙이고 따라 걷기",
        cog:  "포켓몬 카드 짝맞추기 (6쌍부터 시작)",
        supplies: "젓가락, 마스킹테이프, 포켓몬 카드" },
      { title: "ㄹ 문장 + 세모 만들기",

/* ============================================================
   저장 (이 기기 브라우저에 저장)
   ============================================================ */
const KEY = "homeprogram_v1";
let DB = load();
function load(){
  try { const d = JSON.parse(localStorage.getItem(KEY)); if (d) return Object.assign({startDate:"", sessions:{}, homework:{}}, d); }
  catch(e){}
  return { startDate: "", sessions: {}, homework: {} };
}
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(DB)); return true; }
  catch(e){ toast("저장 공간이 부족해요. 기록 탭에서 백업 후 사진을 줄여주세요."); return false; }
}

/* ============================================================
   유틸
   ============================================================ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const DOW = ["일","월","화","수","목","금","토"];
function ymd(d){ const z=n=>String(n).padStart(2,"0"); return d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate()); }
function today(){ return ymd(new Date()); }
function parseYmd(s){ const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); }
function currentWeek(){
  if (!DB.startDate) return null;
  const diff = Math.floor((parseYmd(today()) - parseYmd(DB.startDate)) / 86400000);
  if (diff < 0) return 0;
  return Math.min(4, Math.floor(diff/7)+1);
}
function sid(kid,w,s){ return kid+"-"+w+"-"+s; }
function doneCount(kid){ return Object.keys(DB.sessions).filter(k=>k.startsWith(kid+"-")).length; }
function nextSession(kid){
  const cw = currentWeek();
  const startW = cw && cw>=1 ? cw : 1;
  for (let w=startW; w<=4; w++) for (let s=1; s<=3; s++) if (!DB.sessions[sid(kid,w,s)]) return {w,s};
  for (let w=1; w<=4; w++) for (let s=1; s<=3; s++) if (!DB.sessions[sid(kid,w,s)]) return {w,s};
  return null;
}
function fmt(sec){ const m=Math.floor(Math.abs(sec)/60), s=Math.abs(sec)%60; return (sec<0?"+":"")+String(m).padStart(2,"0")+":"+String(s).padStart(2,"0"); }
let toastT;
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),2200); }
function questionFor(w,s){
  const sess = PROGRAM.jian.weeks[w-1].sessions[s-1];
  if (sess.q) return { q: sess.q, card: false };
  return { q: QUESTION_CARDS[((w-1)*3 + (s-1)) % QUESTION_CARDS.length], card: true };
}

/* ============================================================
   화면 상태
   ============================================================ */
let S = { view: "home", tab: "home" };
let timerInt = null;
function go(patch){ stopTimer(); S = Object.assign({}, S, patch); if (patch.view==='run') S.remain=null; render(); window.scrollTo(0,0); }

function render(){
  const v = S.view;
  if (v === "home") renderHome();
  else if (v === "kid") renderKid();
  else if (v === "run") renderRun();
  else if (v === "result") renderResult();
  else if (v === "records") renderRecords();
  else if (v === "settings") renderSettings();
  renderBottom();
}

function renderBottom(){
  const b = $("#bottom");
  if (S.view === "run" || S.view === "result") { b.style.display = "none"; return; }
  b.style.display = "";
  const t = S.tab;
  b.innerHTML = `<div class="in tabs">
    <button class="${t==='home'?'on':''}" onclick="go({view:'home',tab:'home'})">오늘</button>
    <button class="${t==='records'?'on':''}" onclick="go({view:'records',tab:'records'})">기록·리포트</button>
    <button class="${t==='settings'?'on':''}" onclick="go({view:'settings',tab:'settings'})">설정·원칙</button>
  </div>`;
}

/* ---------- 홈 ---------- */

  const isToday = P.days.includes(dow);

  return `<div class="card kid ${P.cls}" onclick="go({view:'kid',kid:'${kid}',week:${nx?nx.w:1}})">

/* ---------- 아이별 주차/회차 ---------- */

/* ---------- 진행 (단계별) ---------- */
function stepContent(kid,w,s,step){
  const P = PROGRAM[kid], W = P.weeks[w-1];
  if (kid === "jian"){
    const sess = W.sessions[s-1];
    if (step.key === "talk"){ const q = questionFor(w,s);
      return { big: q.q, note: (q.card ? "질문 카드에서 골랐어요. " : "") + '정답 없는 질문이에요. 지안이 생각을 듣고 "왜?", "어떻게 알았어?"로 되물어 주세요.' }; }
    if (step.key === "main") return { big: sess.main, note: (sess.tip ? sess.tip + "<br>" : "") + "생각을 그림으로 표현하기. 자유 그림 시간과는 별개예요." + (sess.book ? `<br><b>그림책 ${sess.book}장면</b> 차례예요.` : "") };
    if (step.key === "write") return { big: "\"왜 이렇게 그렸어?\"에 답하고 연구노트에 3줄 쓰기", note: "① 오늘 한 것 ② 알게 된 것 ③ 아직 궁금한 것<br>이번 주 핵심 단어: <b>" + W.words.map(esc).join(", ") + "</b>" };
    if (step.key === "ai") return { big: W.ai, note: "Claude에게 자기 생각을 설명하고, 반대 의견을 듣고 다시 반박해 보기. <a href=\"https://claude.ai/new\" target=\"_blank\" rel=\"noopener\">Claude 열기 ↗</a>" };
  } else {
    const txt = { lang: W.lang + "<div class='small muted' style='margin-top:6px;font-weight:400'>+ 그 주 치료실 숙제, 생활 단어 3개</div>", work: W.work, cog: W.cog }[step.key];
    return { big: txt, raw: true, note: "성공으로 끝내기. 어려우면 한 단계 낮춰서 마무리해 주세요." };
  }
}

function renderRun(){
  const kid=S.kid, P=PROGRAM[kid], w=S.week, s=S.sess, i=S.step, st=P.steps[i];
  const c = stepContent(kid,w,s,st);
  S.remain = S.remain ?? st.min*60;
  let dots=""; P.steps.forEach((_,k)=> dots += `<i class="${k<=i?'on':''}"></i>`);
  const sgRes = kid==="sg" ? (()=>{ const r=(S.draft.areas||{})[st.key];
    return `<div class="stepname" style="margin-top:14px">어떻게 됐나요?</div>
      <div class="res3">
        <button class="ok ${r==='성공'?'on':''}" onclick="setArea('${st.key}','성공')">성공</button>
        <button class="mid ${r==='부분'?'on':''}" onclick="setArea('${st.key}','부분')">부분</button>
        <button class="help ${r==='도움 필요'?'on':''}" onclick="setArea('${st.key}','도움 필요')">도움 필요</button>
      </div>`; })() : "";
  const last = i === P.steps.length-1;
  $("#app").innerHTML = `
    <header class="top"><button class="back" onclick="if(confirm('진행 중인 회차를 그만둘까요? (기록은 저장되지 않아요)'))go({view:'kid',week:${w}})">✕</button>
      <h1 style="color:${P.color}">${P.name} · ${w}주차 ${s}회차</h1></header>
    <div class="steps">${dots}</div>
    <div class="card">
      <div class="stepname">${i+1}/${P.steps.length} · ${st.title} · ${st.min}분</div>
      <div class="big">${c.raw ? c.big : esc(c.big)}</div>
      <div class="note">${c.note}</div>
      ${sgRes}
    </div>
    <div class="card">
      <div class="timer ${S.remain<0?'over':''}" id="tm">${fmt(S.remain)}</div>
      <div class="row">
        <button class="btn ghost" id="tbtn" onclick="toggleTimer()">${timerInt?'일시정지':'타이머 시작'}</button>
        <button class="btn ghost" onclick="S.remain=${st.min*60};stopTimer();renderRun()">리셋</button>
      </div>
    </div>
    <div class="row">
      ${i>0?`<button class="btn ghost" onclick="stepTo(${i-1})">이전</button>`:""}
      <button class="btn ${P.cls}" onclick="${last?"go({view:'result'})":`stepTo(${i+1})`}">${last?'기록하러 가기':'다음 단계 ›'}</button>
    </div>`;
}
function setArea(k,v){ S.draft.areas = Object.assign({}, S.draft.areas, {[k]:v}); renderRun(); }
function stepTo(n){ stopTimer(); S.step=n; S.remain=null; renderRun(); window.scrollTo(0,0); }
function toggleTimer(){
  if (timerInt){ stopTimer(); renderRun(); return; }
  timerInt = setInterval(()=>{
    S.remain--;
    const el=$("#tm"); if(!el){ stopTimer(); return; }
    el.textContent = fmt(S.remain);
    if (S.remain===0){ el.classList.add("over"); try{navigator.vibrate&&navigator.vibrate([300,150,300]);}catch(e){} beep(); toast("시간이 다 됐어요!"); }
    if (S.remain<0) el.classList.add("over");
  },1000);
  renderRun();
}
function stopTimer(){ if (timerInt){ clearInterval(timerInt); timerInt=null; } }
function beep(){ try{ const a=new (window.AudioContext||window.webkitAudioContext)(); const o=a.createOscillator(); o.connect(a.destination); o.frequency.value=880; o.start(); setTimeout(()=>{o.stop();a.close();},400);}catch(e){} }

/* ---------- 결과 기록 ---------- */
function renderResult(){
  const kid=S.kid, P=PROGRAM[kid], w=S.week, s=S.sess, W=P.weeks[w-1], D=S.draft;
  const elapsed = Math.max(1, Math.round((Date.now()-S.startedAt)/60000));
  if (D.minutes == null) D.minutes = elapsed;
  let body = "";
  if (kid==="jian"){
    const sess = W.sessions[s-1];
    body = `
      <label class="f">지안이가 느낀 난이도</label>
      <div class="res3">${[1,2,3].map(n=>`<button class="neutral ${D.level===n?'on':''}" onclick="keepText();S.draft.level=${n};renderResult()">${["","쉬웠어","적당해","어려웠어"][n]}</button>`).join("")}</div>
      <label class="f">오늘 쓴 핵심 단어 (눌러서 선택)</label>
      <div class="chips">${W.words.map(x=>`<button class="chip ${(D.words||[]).includes(x)?'on':''}" onclick="toggleWord('${x}')">${x}</button>`).join("")}</div>
      ${sess.predict?`<label class="f">예측</label><input type="text" id="f_pred" placeholder="예: 빨대가 더 튼튼할 거야, 왜냐하면…" value="${esc(D.pred)}">
      <label class="f">결과</label><input type="text" id="f_out" placeholder="예: 나무젓가락이 동전 14개 버팀" value="${esc(D.out)}">`:""}
      <label class="f">지안이 대답·생각 한 줄</label><input type="text" id="f_say" placeholder="토론이나 AI 대화에서 한 말" value="${esc(D.say)}">`;
  } else {
    const a = D.areas||{};
    body = `
      ${P.steps.map(st=>`<label class="f">${st.area}</label>
        <div class="res3">${["성공","부분","도움 필요"].map((v,j)=>`<button class="${['ok','mid','help'][j]} ${a[st.key]===v?'on':''}" onclick="S.draft.areas=Object.assign({},S.draft.areas,{${st.key}:'${v}'});keepText();renderResult()">${v}</button>`).join("")}</div>`).join("")}
      <label class="f">실제 발음 (예: 양말 → 양마)</label><input type="text" id="f_say" placeholder="들린 그대로 적기" value="${esc(D.say)}">
      ${s===3?`<label class="f">이번 주, 치료실에서 한 것을 생활에서 했나요?</label>
        <div class="res3">${["예","아니오"].map(v=>`<button class="neutral ${D.life===v?'on':''}" onclick="keepText();S.draft.life='${v}';renderResult()">${v}</button>`).join("")}</div>
        <div class="muted small" style="margin-top:6px">예: 종이에서 세모 그리기와 별개로, 실제 테이프 세모를 따라 걸었는지</div>`:""}`;
  }
  $("#app").innerHTML = `
    <header class="top"><button class="back" onclick="keepText();go({view:'run',step:${P.steps.length-1}})">‹ 이전</button><h1 style="color:${P.color}">${P.name} · ${w}주차 ${s}회차 기록</h1></header>
    <div class="card">
      ${body}
      <label class="f">걸린 시간 (분)</label>
      <input type="text" inputmode="numeric" id="f_min" value="${esc(D.minutes)}">
      <label class="f">부모 관찰 한 줄 메모 <span class="muted small">(필수)</span></label>
      <textarea id="f_memo" placeholder="오늘 눈에 띈 점">${esc(D.memo)}</textarea>
      <label class="f">사진 1장 <span class="muted small">(그림·결과물·활동 장면)</span></label>
      <input type="file" accept="image/*" id="f_photo" onchange="pickPhoto(this)">
      ${D.photo?`<img class="photo" src="${D.photo}" alt="">`:""}
    </div>
    <button class="btn ${P.cls}" onclick="finish()">저장하고 완료 ✓</button>`;
}
function keepText(){
  const g = id => { const el=document.getElementById(id); return el ? el.value : undefined; };
  ["pred","out","say","memo"].forEach(k=>{ const v=g("f_"+k); if(v!==undefined) S.draft[k]=v; });
  const m=g("f_min"); if (m!==undefined) S.draft.minutes=m;
}
function toggleWord(x){ keepText(); const a=S.draft.words||[]; S.draft.words = a.includes(x)?a.filter(y=>y!==x):a.concat(x); renderResult(); }
function pickPhoto(inp){
  keepText();
  const f = inp.files && inp.files[0]; if (!f) return;
  const img = new Image(); const url = URL.createObjectURL(f);
  img.onload = () => {
    const max = 900, r = Math.min(1, max/Math.max(img.width, img.height));
    const c = document.createElement("canvas"); c.width=Math.round(img.width*r); c.height=Math.round(img.height*r);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    S.draft.photo = c.toDataURL("image/jpeg", 0.7); URL.revokeObjectURL(url); renderResult();
  };
  img.src = url;
}
function finish(){
  keepText();
  const D=S.draft, kid=S.kid;
  if (!D.memo || !D.memo.trim()){ toast("메모 한 줄은 꼭 남겨주세요"); $("#f_memo").focus(); return; }
  if (kid==="sg"){ const a=D.areas||{}; if (!a.lang||!a.work||!a.cog){ toast("언어·작업·인지 결과를 눌러주세요"); return; } }
  const rec = Object.assign({ kid, week:S.week, sess:S.sess, date: today(), savedAt: new Date().toISOString() }, D);
  rec.minutes = parseInt(D.minutes,10) || null;
  DB.sessions[sid(kid,S.week,S.sess)] = rec;
  if (!save()) { delete rec.photo; DB.sessions[sid(kid,S.week,S.sess)] = rec; if (save()) toast("사진은 용량 때문에 빼고 저장했어요"); }
  else toast("저장했어요 👏");
  go({view:"kid", week:S.week, draft:{}});
}

/* ---------- 기록·리포트 ---------- */
function recLine(r){
  if (r.kid==="jian") return [r.level?`난이도 ${["","쉬웠어","적당해","어려웠어"][r.level]}`:"", (r.words||[]).length?`단어: ${r.words.join(", ")}`:"", r.pred?`예측: ${r.pred}`:"", r.out?`결과: ${r.out}`:"", r.say?`말: ${r.say}`:""].filter(Boolean).join(" · ");
  const a=r.areas||{}; return [`언어 ${a.lang||"-"}`,`작업 ${a.work||"-"}`,`인지 ${a.cog||"-"}`, r.say?`발음: ${r.say}`:"", r.life?`생활에서 했나: ${r.life}`:""].filter(Boolean).join(" · ");
}
function weekReport(kid,w){
  const P=PROGRAM[kid];
  const recs=[1,2,3].map(s=>DB.sessions[sid(kid,w,s)]).filter(Boolean);
  const mins=recs.reduce((t,r)=>t+(r.minutes||0),0);
  let lines=[`[${P.name} ${w}주차 리포트] ${P.weeks[w-1].title}`, `완료 회차: ${recs.length}/3 · 총 ${mins}분`];
  if (kid==="sg"){
    const all=recs.flatMap(r=>Object.values(r.areas||{}));
    const ok=all.filter(x=>x==="성공").length;
    if (all.length) lines.push(`성공률: ${Math.round(ok/all.length*100)}% (${ok}/${all.length})`);
    ["lang","work","cog"].forEach((k,j)=>{ const v=recs.map(r=>(r.areas||{})[k]).filter(Boolean);
      if (v.length) lines.push(`- ${["언어","작업","인지"][j]}: ${v.join(" → ")}`); });
    if (DB.startDate){
      const st=parseYmd(DB.startDate); st.setDate(st.getDate()+(w-1)*7);
      let hw=0; for(let i=0;i<7;i++){ const x=new Date(st); x.setDate(st.getDate()+i); if(DB.homework[ymd(x)]) hw++; }
      lines.push(`언어 숙제 수행: ${hw}/7일`);
    }
    const life=recs.find(r=>r.life); if (life) lines.push(`생활에서 했나: ${life.life}`);
    const say=recs.map(r=>r.say).filter(Boolean); if (say.length) lines.push(`실제 발음: ${say.join(" / ")}`);
  } else {
    const lv=recs.map(r=>r.level).filter(Boolean); if (lv.length) lines.push(`난이도: ${lv.map(n=>["","쉬움","적당","어려움"][n]).join(" → ")}`);
    const ws=[...new Set(recs.flatMap(r=>r.words||[]))]; if (ws.length) lines.push(`쓴 핵심 단어: ${ws.join(", ")}`);
    recs.filter(r=>r.pred||r.out).forEach(r=>lines.push(`${r.sess}회차 예측/결과: ${r.pred||"-"} → ${r.out||"-"}`));
  }
  recs.forEach(r=>lines.push(`${r.sess}회차 메모: ${r.memo}`));
  return lines.join("\n");
}
function renderRecords(){
  const kid = S.rkid || "jian";
  const P = PROGRAM[kid];
  const recs = Object.values(DB.sessions).filter(r=>r.kid===kid).sort((a,b)=>(a.week-b.week)||(a.sess-b.sess));
  let reports="";
  for (let w=1;w<=4;w++){ if ([1,2,3].some(s=>DB.sessions[sid(kid,w,s)])){
    reports += `<div class="card"><pre class="report" id="rep${w}">${esc(weekReport(kid,w))}</pre>
      <button class="btn ghost" onclick="copyText($('#rep${w}').textContent)">리포트 복사${kid==='sg'?' (치료실 공유용)':''}</button></div>`; } }
  const list = recs.map(r=>`<div class="rec ${P.cls}" id="r-${sid(r.kid,r.week,r.sess)}">
      <div><b>${r.week}주차 ${r.sess}회차</b> <span class="muted small">${r.date}${r.minutes?` · ${r.minutes}분`:""}</span>
        <button class="linkbtn" style="float:right;color:var(--help)" onclick="delRec('${sid(r.kid,r.week,r.sess)}')">삭제</button></div>
      <div class="small">${esc(recLine(r))}</div>
      <div class="small muted">${esc(r.memo)}</div>
      ${r.photo?`<img class="photo" src="${r.photo}" alt="" loading="lazy">`:""}
    </div>`).join("") || `<div class="muted">아직 기록이 없어요.</div>`;
  $("#app").innerHTML = `
    <header class="top"><h1>기록·리포트</h1></header>
    <div class="weeks">
      <button class="${kid==='jian'?'on':''}" onclick="go({rkid:'jian'})">지안</button>
      <button class="${kid==='sg'?'on':''}" onclick="go({rkid:'sg'})">선규</button>
    </div>
    ${reports ? `<h3>주간 리포트</h3>${reports}` : ""}
    <h3>${kid==='jian'?'지안 포트폴리오':'선규 활동 기록'} (날짜순)</h3>
    <div class="card">${list}</div>
    <div class="row">
      <button class="btn ghost" onclick="exportCSV()">엑셀용 CSV 받기</button>
      <button class="btn ghost" onclick="go({view:'settings',tab:'settings'})">백업/복원</button>
    </div>`;
  if (S.focus){ const el=document.getElementById("r-"+S.focus); if(el) setTimeout(()=>el.scrollIntoView({block:"center"}),50); S.focus=null; }
}
function delRec(k){ if(confirm("이 기록을 삭제할까요?")){ delete DB.sessions[k]; save(); render(); } }
function copyText(t){
  (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(()=>toast("복사했어요"))
  .catch(()=>{ const ta=document.createElement("textarea"); ta.value=t; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); toast("복사했어요"); });
}
function download(name, text, type){
  const blob = new Blob([text], {type}); const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function exportCSV(){
  const head=["날짜","아이","주차","회차","걸린시간(분)","난이도(지안)","핵심단어","예측","결과","대답/발음","언어","작업","인지","생활에서 했나","메모","사진"];
  const rows=Object.values(DB.sessions).sort((a,b)=>a.kid.localeCompare(b.kid)||(a.week-b.week)||(a.sess-b.sess)).map(r=>[
    r.date, PROGRAM[r.kid].name, r.week, r.sess, r.minutes??"", r.level?["","쉬움","적당","어려움"][r.level]:"",
    (r.words||[]).join(" "), r.pred||"", r.out||"", r.say||"", (r.areas||{}).lang||"", (r.areas||{}).work||"", (r.areas||{}).cog||"",
    r.life||"", r.memo||"", r.photo?"있음":""]);
  const hw = Object.keys(DB.homework).sort().map(d=>[d,"선규","","","5","","","","","","숙제","","","","매일 언어 숙제 완료",""]);
  const csv = [head,...rows,...hw].map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(",")).join("\r\n");
  download(`홈프로그램_기록_${today()}.csv`, "﻿"+csv, "text/csv;charset=utf-8");
}

/* ---------- 설정·원칙 ---------- */
function renderSettings(){
  $("#app").innerHTML = `
    <header class="top"><h1>설정·원칙</h1></header>
    <div class="card">
      <h2>1주차 시작일</h2>
      <div class="muted small">시작일을 정하면 몇 주차인지, 숙제 수행일수가 자동으로 계산돼요.</div>
      <input type="date" id="sd" value="${DB.startDate}" style="margin-top:10px" onchange="DB.startDate=this.value;save();toast('시작일 저장')">
      <div class="muted small" style="margin-top:8px">요일: 지안 월·수·토 / 선규 화·목·일 + 매일 언어 숙제 5분</div>
    </div>
    <div class="card">
      <h2>운영 원칙</h2>
      <ul class="clean">${PRINCIPLES.map(p=>`<li>${esc(p)}</li>`).join("")}</ul>
    </div>
    <div class="card">
      <h2>백업 / 복원</h2>
      <div class="muted small">기록은 이 폰(브라우저)에만 저장돼요. 가끔 백업 파일을 받아두고, 다른 폰으로 옮길 때 복원하세요.</div>
      <div class="row" style="margin-top:10px">
        <button class="btn ghost" onclick="download('홈프로그램_백업_'+today()+'.json', JSON.stringify(DB), 'application/json')">백업 받기</button>
        <button class="btn ghost" onclick="$('#imp').click()">복원하기</button>
      </div>
      <input type="file" id="imp" accept="application/json,.json" style="display:none" onchange="importJSON(this)">
    </div>
    <div class="card">
      <h2>시작 전 확인할 것</h2>
      <ul class="clean small">
        <li>언어치료 선생님: 이번 달 ㄹ 목표와 집 숙제 방식이 맞는지</li>
        <li>작업치료 선생님: 사선·세모 활동을 집에서 해도 되는지 (검사지 VMI 도형은 집에서 반복하지 않기)</li>
        <li>인지치료 선생님: 현재 과제별 레벨, 집에서 이어갈 게임</li>
        <li>지안 논술 선생님: 추론·근거 대기 질문 돕는 방법</li>
        <li>선규 집중 가능 시간 확인 후 회차 길이 조정</li>
      </ul>
    </div>
    <button class="btn ghost" style="color:var(--help)" onclick="if(confirm('모든 기록을 지울까요? 되돌릴 수 없어요.')){DB={startDate:'',sessions:{},homework:{}};save();render();}">전체 기록 초기화</button>`;
}
function importJSON(inp){
  const f=inp.files&&inp.files[0]; if(!f) return;
  const rd=new FileReader(); rd.onload=()=>{ try{ const d=JSON.parse(rd.result); if(!d.sessions) throw 0;
    if(confirm("지금 기록을 백업 파일 내용으로 바꿀까요?")){ DB=Object.assign({startDate:"",sessions:{},homework:{}},d); save(); toast("복원했어요"); render(); } }
    catch(e){ toast("백업 파일이 아니에요"); } }; rd.readAsText(f);
}

render();
</script>
